name: Deploy Website to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploying latest code
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftp
        # Tambahkan baris di bawah ini untuk melewati verifikasi sertifikat SSL FTP yang sering bikin macet
        security: loose
          # 🚫 Daftar folder yang DIABAIKAN (tidak ikut di-upload agar tidak merusak data cPanel)
          exclude: |
            **/.git*
            **/node_modules/**
            **/vendor/**
            .env
            storage/**
            tests/**
